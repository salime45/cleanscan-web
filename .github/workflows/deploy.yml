name: Deploy to Sered

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to Sered by FTP
        env:
          FTP_HOST: ftp://193.84.177.61
          FTP_USER: cleanscan@cleanscan.site
          FTP_PASSWORD: NEhadMMz84poC2xKqq6z
        run: |
          lftp -e "
          set ftp:ssl-allow yes;
          set ssl:verify-certificate no;
          set ftp:passive-mode yes;
          set net:max-retries 2;
          set net:timeout 20;
          set mirror:parallel-transfer-count 8;
          mirror -R --delete --only-newer --parallel=8 out/ /;
          bye
          " -u "$FTP_USER,$FTP_PASSWORD" "ftp://$FTP_HOST:${FTP_PORT:-21}"