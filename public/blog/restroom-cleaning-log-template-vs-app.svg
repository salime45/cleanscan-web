<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Restroom cleaning log template versus app illustration</title>
  <desc id="desc">A split CleanScan-style illustration comparing a paper restroom cleaning log with a digital restroom cleaning app workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfd"/>
      <stop offset="0.46" stop-color="#edf8fb"/>
      <stop offset="1" stop-color="#eaf8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#123158" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="186" cy="118" r="142" fill="#1b7fbf" opacity="0.10"/>
  <circle cx="1012" cy="536" r="180" fill="#36b37e" opacity="0.12"/>
  <rect x="104" y="94" width="992" height="488" rx="40" fill="#ffffff" opacity="0.72"/>
  <line x1="600" y1="132" x2="600" y2="544" stroke="#dbe9ef" stroke-width="2" stroke-dasharray="10 12"/>

  <g transform="translate(150 134)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="390" rx="28" fill="#ffffff" stroke="#dbe9ef"/>
    <rect x="42" y="42" width="276" height="46" rx="10" fill="#f2f6f8"/>
    <text x="62" y="72" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#123158">Paper log</text>
    <text x="62" y="110" font-family="Inter, Arial, sans-serif" font-size="14" fill="#607887">Simple to print, harder to supervise live</text>

    <g transform="translate(42 138)">
      <rect width="276" height="198" rx="14" fill="#fbfdfe" stroke="#dbe9ef"/>
      <line x1="0" y1="44" x2="276" y2="44" stroke="#dbe9ef"/>
      <line x1="68" y1="0" x2="68" y2="198" stroke="#dbe9ef"/>
      <line x1="138" y1="0" x2="138" y2="198" stroke="#dbe9ef"/>
      <line x1="210" y1="0" x2="210" y2="198" stroke="#dbe9ef"/>
      <text x="16" y="28" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#607887">Time</text>
      <text x="84" y="28" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#607887">Check</text>
      <text x="154" y="28" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#607887">Issue</text>
      <text x="224" y="28" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#607887">Sign</text>
      <line x1="0" y1="88" x2="276" y2="88" stroke="#dbe9ef"/>
      <line x1="0" y1="132" x2="276" y2="132" stroke="#dbe9ef"/>
      <line x1="0" y1="176" x2="276" y2="176" stroke="#dbe9ef"/>
      <path d="M92 62l9 9 19-24" fill="none" stroke="#36b37e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M92 107l9 9 19-24" fill="none" stroke="#36b37e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M222 61c14-9 28-6 38 4" fill="none" stroke="#123158" stroke-width="3" stroke-linecap="round" opacity="0.58"/>
      <path d="M222 107c10-8 24-7 40 3" fill="none" stroke="#123158" stroke-width="3" stroke-linecap="round" opacity="0.38"/>
      <rect x="151" y="148" width="42" height="10" rx="5" fill="#de5b55" opacity="0.24"/>
    </g>

    <g transform="translate(42 354)">
      <circle cx="12" cy="12" r="12" fill="#f4a261"/>
      <text x="34" y="17" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#9d5d1c">Can be filled out late</text>
    </g>
  </g>

  <g transform="translate(690 134)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="390" rx="28" fill="#123158"/>
    <rect x="18" y="18" width="324" height="354" rx="22" fill="#ffffff"/>
    <rect x="42" y="42" width="276" height="64" rx="16" fill="#e8f7fb"/>
    <text x="62" y="72" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#123158">Restroom app</text>
    <text x="62" y="94" font-family="Inter, Arial, sans-serif" font-size="14" fill="#607887">Scheduled checks with live visibility</text>

    <g transform="translate(42 132)">
      <rect width="276" height="58" rx="18" fill="#f7fbfd" stroke="#dbe9ef"/>
      <circle cx="34" cy="29" r="14" fill="#36b37e"/>
      <path d="M27 29l6 6 12-16" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="62" y="26" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#123158">12:00 restroom check</text>
      <text x="62" y="44" font-family="Inter, Arial, sans-serif" font-size="12" fill="#607887">FOH staff completed</text>
    </g>

    <g transform="translate(42 208)">
      <rect width="276" height="58" rx="18" fill="#fff5e6" stroke="#f7dfbd"/>
      <circle cx="34" cy="29" r="14" fill="#f4a261"/>
      <text x="29" y="35" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">!</text>
      <text x="62" y="26" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#123158">Supplies low</text>
      <text x="62" y="44" font-family="Inter, Arial, sans-serif" font-size="12" fill="#607887">Paper towels added to follow-up</text>
    </g>

    <g transform="translate(42 284)">
      <rect width="276" height="58" rx="18" fill="#eef6fb" stroke="#dbe9ef"/>
      <circle cx="34" cy="29" r="14" fill="#1b7fbf"/>
      <path d="M26 29h16M34 21v16" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <text x="62" y="26" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#123158">Manager review</text>
      <text x="62" y="44" font-family="Inter, Arial, sans-serif" font-size="12" fill="#607887">Visible during service</text>
    </g>
  </g>

  <g transform="translate(512 248)">
    <circle cx="88" cy="88" r="66" fill="#ffffff" stroke="#dbe9ef" filter="url(#shadow)"/>
    <rect x="62" y="46" width="52" height="82" rx="18" fill="#e8f7fb" stroke="#1b7fbf" stroke-width="4"/>
    <rect x="70" y="58" width="36" height="30" rx="8" fill="#ffffff"/>
    <rect x="58" y="132" width="60" height="12" rx="6" fill="#123158" opacity="0.78"/>
    <circle cx="88" cy="104" r="6" fill="#36b37e"/>
  </g>

  <text x="104" y="620" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#123158">CleanScan</text>
  <text x="226" y="620" font-family="Inter, Arial, sans-serif" font-size="18" fill="#607887">Restroom checks from template to digital workflow</text>
</svg>
