  <text x="88" y="612" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#123158">CleanScan</text>
  <text x="210" y="612" font-family="Inter, Arial, sans-serif" font-size="18" fill="#607887">Digital checklists for restaurant shifts</text>
