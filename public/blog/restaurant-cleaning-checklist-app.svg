      <rect x="18" y="85" width="100" height="34" rx="17" fill="#eaf8f0"/>
      <circle cx="38" cy="102" r="8" fill="#36b37e"/>
      <path d="M34 101l3 4 8-9" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="55" y="107" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f7454">Completed</text>
      <rect x="18" y="137" width="100" height="34" rx="17" fill="#eef6fb"/>
